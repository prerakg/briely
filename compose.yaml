services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: briefly
      POSTGRES_USER: briefly
      POSTGRES_PASSWORD: briefly_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - briefly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefly -d briefly"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  briefly_postgres:
